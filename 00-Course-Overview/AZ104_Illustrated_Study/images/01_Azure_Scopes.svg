<svg xmlns="http://www.w3.org/2000/svg" width="960" height="553" viewBox="0 0 960 553"><rect width="960" height="553" fill="#edf3f9"/><rect width="960" height="98" fill="#132b45"/><text x="38" y="60" fill="white" font-family="sans-serif" font-size="31" font-weight="bold">Azure resource scopes</text><rect x="38" y="118" width="884" height="89" rx="12" fill="white" stroke="#c2d5e4"/><text x="62" y="151" fill="#145a85" font-family="sans-serif" font-size="23" font-weight="bold">Management group</text><text x="62" y="183" fill="#132b45" font-family="sans-serif" font-size="18">Organizes subscriptions; assignments can flow down the hierarchy.</text><rect x="38" y="225" width="884" height="89" rx="12" fill="white" stroke="#c2d5e4"/><text x="62" y="258" fill="#145a85" font-family="sans-serif" font-size="23" font-weight="bold">Subscription</text><text x="62" y="290" fill="#132b45" font-family="sans-serif" font-size="18">Billing and management boundary containing resource groups.</text><rect x="38" y="332" width="884" height="89" rx="12" fill="white" stroke="#c2d5e4"/><text x="62" y="365" fill="#145a85" font-family="sans-serif" font-size="23" font-weight="bold">Resource group</text><text x="62" y="397" fill="#132b45" font-family="sans-serif" font-size="18">Groups related Azure resources for management.</text><rect x="38" y="439" width="884" height="89" rx="12" fill="white" stroke="#c2d5e4"/><text x="62" y="472" fill="#145a85" font-family="sans-serif" font-size="23" font-weight="bold">Resource</text><text x="62" y="504" fill="#132b45" font-family="sans-serif" font-size="18">A specific VM, storage account or other deployed service.</text></svg>